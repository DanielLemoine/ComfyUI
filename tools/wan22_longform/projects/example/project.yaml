workflow_api: ../../workflows/api/wan22_segment_i2v_native_api.json
bridge_workflow_api: ../../workflows/api/wan22_bridge_flf2v_native_api.json
workflow_hashes:
  segment_api: fe7ffa26875ced3487956a68f417cec61a126bebd1e0133cf7bd481ddc069883
  bridge_api: be005de9c98fcd4467ee0f26b784cd925d79e4eac1e5ec0d127d56517c378126

# Captured from the local preflight on 2026-07-19. Refresh before a production run.
environment_snapshot:
  captured_at: "2026-07-19T00:00:00Z"
  platform: Windows-10-10.0.26200-SP0
  python: CPython 3.11.6
  gpu: NVIDIA GeForce RTX 5090, 595.95, 32607 MiB

attempts_dir: attempts
policy:
  automatic_continuation: false
continuation:
  strategy: selected_tail
  reset_limit: 3
qc:
  candidate_count: 5
  retry_limit: 2

loras:
  identity:
    mode: none
  vbvr:
    enabled: false
  motion:
    enabled: false
  corrective:
    enabled: false
  permissiveness:
    mystic:
      enabled: false
    wan_general:
      enabled: false

request:
  positive: >-
    A fully clothed adult woman in a charcoal overshirt and dark trousers, natural skin texture,
    calm neutral expression, realistic indoor daylight, coherent anatomy, cinematic but restrained
    camera movement, no text or logos.
  negative: >-
    low quality, overexposure, still image, subtitles, watermark, distorted anatomy, extra fingers,
    malformed hands, duplicate limbs, unstable face, abrupt camera jump, crowded background.

prompt_blocks:
  identity_lock: >-
    The same adult reference subject; preserve adult identity, hairstyle, body silhouette,
    clothing, fabric, colors, and fit without glamour framing.
  continuity_lock: >-
    Continue the established motion, camera path, environment, lighting, and wardrobe without a pose reset.
  negative: >-
    distorted anatomy, extra fingers, malformed hands, duplicate limbs, unstable face, camera reset,
    flicker, body reshaping, glamour pose, cleavage emphasis, chest bounce.

shots:
  - id: S010
    target_seconds: 2.125
    # Add this user-owned fully clothed adult anchor before any render.
    anchor_image: inputs/s010_anchor.png
    camera: slow forward dolly, eye-level framing
    environment: quiet modern hallway with soft window light
    segments:
      - id: S010_C001
        action: The adult walks three measured steps down the hallway and pauses naturally.
        expected_seconds: 1.0625
        seed_offset: 0
      - id: S010_C002
        action: The same adult continues one measured step from the accepted prior tail frame.
        expected_seconds: 1.0625
        seed_offset: 17
        continue_from: S010_C001
  - id: S020
    target_seconds: 1.0625
    # This reset anchor is also user-supplied; it is not an identity LoRA claim.
    anchor_image: inputs/s020_anchor.png
    camera: gentle lateral move, eye-level framing
    environment: the same hallway and lighting continuity
    segments:
      - id: S020_C001
        action: The adult turns slightly toward a closed office door, then settles into a still pose.
        expected_seconds: 1.0625
        seed_offset: 34

bridges:
  - id: B010
    shot_id: S010
    strategy: flf2v
    purpose: technical_smoke
    # This explicit technical smoke uses the declared anchor for both endpoints.
    # Story bridges must use accepted tail/head QC candidates instead.
    base_source_image: inputs/s010_anchor.png
    frames: 33

# Project assembly does not infer chronology from attempt folders. B010 remains a separate
# technical smoke and is intentionally excluded from the production timeline.
assembly_order:
  - shot_id: S010
    segment_id: S010_C001
  - shot_id: S010
    segment_id: S010_C002
  - shot_id: S020
    segment_id: S020_C001
