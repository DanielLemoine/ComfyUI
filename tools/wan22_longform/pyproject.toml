[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wan22-longform"
version = "0.1.0"
description = "Local-only Wan2.2 long-form preflight tooling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wan22-longform = "wan22_longform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
